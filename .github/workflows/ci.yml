---
name: CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Integration tests
        run: go test -tags integration -v -timeout 120s ./integration/...

      - name: Build
        run: CGO_ENABLED=0 go build -o rbackup .

      - name: Generate checksums
        run: |
          sha256sum rbackup > SHA256SUMS
